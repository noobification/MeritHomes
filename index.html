<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Page-specific head tags (title, description, canonical, Open Graph,
    Twitter, JSON-LD) are managed per-route by src/components/Seo.jsx and
    baked into static HTML by scripts/prerender.mjs. Do not add them here
    or prerendered pages will ship duplicate/conflicting tags.
  -->
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="author" content="Merit Homes" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="geo.region" content="US-IL" />
  <meta name="geo.placename" content="Lemont" />
  <!--app-head-->

  <!-- Mobile LCP: the hero poster is the largest above-the-fold element on
       phones (desktop plays video instead, so the preload is media-scoped) -->
  <link rel="preload" as="image" href="/mobile-hero-poster.webp" media="(max-width: 767px)" fetchpriority="high" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Fonts (Async) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="root"><!--app-html--></div>

  <!-- Hidden static form for Netlify recognition -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="timeline">
      <option>Within 6 months</option>
      <option>6 - 12 months</option>
      <option>1 - 2 years</option>
      <option>Exploring options</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
